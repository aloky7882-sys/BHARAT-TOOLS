<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Compressor | BHARAT TOOLS</title>

<link rel="stylesheet" href="image-compressor.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header>

<div class="logo">

⚡ BHARAT TOOLS

</div>

</header>

<main>

<section class="hero">

<h1>

Compress Images Online

</h1>

<p>

Reduce JPG, PNG & WEBP image size without losing quality.

</p>

</section>

<section class="upload-box">

<div class="drop-area" id="drop-area">

<div class="upload-icon">
<i class="fa-solid fa-cloud-arrow-up"></i>
</div>

<h2>

Drag & Drop Images Here

</h2>

<p>

or click to choose images (multiple allowed)

</p>

<div class="upload-formats">

JPG / PNG / WEBP

</div>

<br>

<input type="file"

id="fileElem"

multiple

accept="image/*"

hidden>

<button id="selectBtn">

Select Images

</button>

</div>

</section>

<div id="status"></div>

<section id="previewArea">

</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>

<script src="image-compressor.js"></script>

</body>

</html>
