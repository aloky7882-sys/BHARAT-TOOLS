<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Compressor - Bharat Tools</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6fb;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:700px;
background:#fff;
padding:30px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.1);
}

h1{
text-align:center;
margin-bottom:20px;
}

input[type=file]{
width:100%;
margin:20px 0;
}

img{
width:100%;
display:none;
margin-top:20px;
border-radius:10px;
}

.info{
margin-top:20px;
line-height:35px;
}

button{
margin-top:20px;
background:#0d6efd;
color:white;
border:none;
padding:15px 30px;
border-radius:8px;
cursor:pointer;
font-size:16px;
display:none;
}

button:hover{
background:#084298;
}
</style>

</head>
<body>

<div class="container">

<h1>🖼 Image Compressor</h1>

<input type="file" id="upload" accept="image/*">

<img id="preview">

<div class="info">
<p>Original Size : <span id="original">0 KB</span></p>
<p>Compressed Size : <span id="compressed">0 KB</span></p>
</div>

<button id="download">Download Compressed Image</button>

</div>

<script>

const upload=document.getElementById("upload");
const preview=document.getElementById("preview");
const original=document.getElementById("original");
const compressed=document.getElementById("compressed");
const download=document.getElementById("download");

let compressedImage="";

upload.addEventListener("change",function(){

const file=this.files[0];

if(!file) return;

original.innerHTML=(file.size/1024).toFixed(2)+" KB";

const reader=new FileReader();

reader.onload=function(e){

const img=new Image();

img.onload=function(){

const canvas=document.createElement("canvas");
const ctx=canvas.getContext("2d");

canvas.width=img.width;
canvas.height=img.height;

ctx.drawImage(img,0,0);

compressedImage=canvas.toDataURL("image/jpeg",0.5);

preview.src=compressedImage;
preview.style.display="block";

const size=Math.round((compressedImage.length*3)/4/1024);

compressed.innerHTML=size+" KB";

download.style.display="inline-block";

}

img.src=e.target.result;

}

reader.readAsDataURL(file);

});

download.addEventListener("click",function(){

const a=document.createElement("a");

a.href=compressedImage;

a.download="compressed-image.jpg";

a.click();

});

</script>

</body>
</html>
