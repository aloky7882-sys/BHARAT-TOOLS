<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merge PDF - Bharat Tools</title>

<!-- PDF library -->
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
if (!window.PDFLib) {
    document.write('<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"><\/script>');
}
</script>

<!-- Better PDF icon -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6fb;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
background:#fff;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
max-width:700px;
width:100%;
text-align:center;
}

h1{
margin-bottom:20px;
}

.upload-zone{
position:relative;
border:2px dashed #0d6efd;
border-radius:12px;
padding:32px 20px;
margin:20px 0;
background:#f8f9fa;
cursor:pointer;
transition:all .2s ease;
overflow:hidden;
}

.upload-zone:hover,
.upload-zone.dragover{
background:#eef5ff;
border-color:#0b5ed7;
transform:translateY(-1px);
}

.upload-zone input{
position:absolute;
inset:0;
width:100%;
height:100%;
opacity:0;
cursor:pointer;
margin:0;
}

.upload-icon{
width:76px;
height:76px;
margin:0 auto 14px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:#e7f0ff;
color:#0d6efd;
font-size:34px;
transition:transform .2s ease;
}

.upload-zone:hover .upload-icon{
transform:translateY(-3px);
}

.upload-title{
font-size:18px;
font-weight:700;
color:#212529;
margin-bottom:6px;
}

.upload-subtitle{
font-size:14px;
color:#6c757d;
margin-bottom:10px;
}

.upload-formats{
display:inline-block;
padding:5px 10px;
border-radius:20px;
background:#fff;
border:1px solid #dee2e6;
color:#6c757d;
font-size:12px;
font-weight:600;
}

#file-list{
margin-top:15px;
text-align:left;
font-size:14px;
color:#495057;
}

.file-item{
display:flex;
align-items:center;
gap:8px;
padding:8px 10px;
margin:5px 0;
background:#f8f9fa;
border-radius:7px;
word-break:break-word;
}

.file-item i{
color:#dc3545;
}

button{
padding:15px 25px;
background:#0d6efd;
color:#fff;
border:none;
border-radius:8px;
cursor:pointer;
font-size:18px;
margin-top:20px;
width:100%;
font-weight:600;
}

button:hover{
background:#084298;
}

button:disabled{
opacity:.65;
cursor:not-allowed;
}

#status{
margin-top:20px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h1>
<i class="fa-solid fa-layer-group" style="color:#0d6efd;"></i>
Merge PDF
</h1>

<div class="upload-zone" id="dropZone">

<div class="upload-icon">
<i class="fa-solid fa-cloud-arrow-up"></i>
</div>

<div class="upload-title">
Drag & Drop your PDF files here
</div>

<div class="upload-subtitle">
or click to choose multiple PDF files
</div>

<div class="upload-formats">
PDF • Select 2 or more files
</div>

<input type="file"
id="upload"
multiple
accept=".pdf,application/pdf">

</div>

<div id="file-list"></div>

<button id="merge" disabled>
<i class="fa-solid fa-code-merge"></i>
Merge & Download
</button>

<p id="status"></p>

</div>

<script>

const upload = document.getElementById("upload");
const dropZone = document.getElementById("dropZone");
const status = document.getElementById("status");
const mergeBtn = document.getElementById("merge");
const fileList = document.getElementById("file-list");

let selectedFiles = [];


/* =========================
   SHOW SELECTED FILES
========================= */

function showFiles(files){

    selectedFiles = Array.from(files).filter(file =>
        file.type === "application/pdf" ||
        file.name.toLowerCase().endsWith(".pdf")
    );

    fileList.innerHTML = "";

    if(selectedFiles.length === 0){

        mergeBtn.disabled = true;

        status.innerText =
            "❌ Please select PDF files only.";

        status.style.color = "#dc3545";

        return;
    }

    selectedFiles.forEach((file,index)=>{

        const item = document.createElement("div");

        item.className = "file-item";

        item.innerHTML =
            '<i class="fa-solid fa-file-pdf"></i>' +
            '<span>' +
            (index + 1) + ". " +
            file.name +
            '</span>';

        fileList.appendChild(item);

    });

    if(selectedFiles.length < 2){

        mergeBtn.disabled = true;

        status.innerText =
            "⚠️ Select at least 2 PDF files to merge.";

        status.style.color = "#dc3545";

    }else{

        mergeBtn.disabled = false;

        status.innerText =
            "✅ " + selectedFiles.length +
            " PDF files selected. Ready to merge.";

        status.style.color = "#198754";

    }
}


/* =========================
   NORMAL SELECT
========================= */

upload.addEventListener("change",function(){

    showFiles(this.files);

});


/* =========================
   DRAG & DROP
========================= */

dropZone.addEventListener("dragover",function(e){

    e.preventDefault();

    dropZone.classList.add("dragover");

});


dropZone.addEventListener("dragleave",function(){

    dropZone.classList.remove("dragover");

});


dropZone.addEventListener("drop",function(e){

    e.preventDefault();

    dropZone.classList.remove("dragover");

    showFiles(e.dataTransfer.files);

});


/* =========================
   MERGE PDF
========================= */

mergeBtn.addEventListener("click",async function(){

    if(selectedFiles.length < 2){

        status.innerText =
            "⚠️ Please select at least 2 PDF files.";

        status.style.color = "#dc3545";

        return;
    }


    if(!window.PDFLib){

        status.innerText =
            "❌ PDF library failed to load. Please refresh the page.";

        status.style.color = "#dc3545";

        console.error("PDF-LIB not loaded.");

        return;
    }


    mergeBtn.disabled = true;

    status.innerText =
        "Merging PDF files... Please wait.";

    status.style.color = "#0d6efd";


    try{

        const mergedPdf =
            await PDFLib.PDFDocument.create();


        for(let i=0;i<selectedFiles.length;i++){

            status.innerText =
                "Merging PDF " +
                (i+1) +
                " of " +
                selectedFiles.length +
                "...";


            const bytes =
                await selectedFiles[i].arrayBuffer();


            const pdf =
                await PDFLib.PDFDocument.load(bytes);


            const pages =
                await mergedPdf.copyPages(
                    pdf,
                    pdf.getPageIndices()
                );


            pages.forEach(page=>{
                mergedPdf.addPage(page);
            });

        }


        const pdfBytes =
            await mergedPdf.save();


        const blob =
            new Blob(
                [pdfBytes],
                {type:"application/pdf"}
            );


        const url =
            URL.createObjectURL(blob);


        const link =
            document.createElement("a");


        link.href = url;

        link.download =
            "Merged-PDF.pdf";

        document.body.appendChild(link);

        link.click();

        link.remove();


        setTimeout(()=>{
            URL.revokeObjectURL(url);
        },1000);


        status.innerText =
            "🎉 PDF Merged Successfully!";

        status.style.color =
            "#28a745";


    }
    catch(error){

        console.error(
            "PDF merge error:",
            error
        );

        status.innerText =
            "❌ Merge failed. Please check that all PDFs are valid and not password protected.";

        status.style.color =
            "#dc3545";

    }
    finally{

        mergeBtn.disabled =
            selectedFiles.length < 2;

    }

});

</script>

</body>
</html>
