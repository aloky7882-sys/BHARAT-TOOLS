<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Resizer - Bharat Tools</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6fb;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
background:#fff;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
width:100%;
max-width:700px;
text-align:center;
}

h1{
margin-bottom:20px;
}

.upload-zone{
position:relative;
border:2px dashed #0d6efd;
border-radius:12px;
padding:32px 20px;
margin:20px 0;
background:#f8f9fa;
cursor:pointer;
transition:all .2s ease;
overflow:hidden;
}

.upload-zone:hover,
.upload-zone.dragover{
background:#eef5ff;
border-color:#0b5ed7;
transform:translateY(-1px);
}

.upload-zone input{
position:absolute;
inset:0;
width:100%;
height:100%;
opacity:0;
cursor:pointer;
margin:0;
}

.upload-icon{
width:76px;
height:76px;
margin:0 auto 14px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:#e7f0ff;
color:#0d6efd;
font-size:34px;
transition:transform .2s ease;
}

.upload-zone:hover .upload-icon{
transform:translateY(-3px);
}

.upload-title{
font-size:18px;
font-weight:700;
color:#212529;
margin-bottom:6px;
}

.upload-subtitle{
font-size:14px;
color:#6c757d;
margin-bottom:10px;
}

.upload-formats{
display:inline-block;
padding:5px 10px;
border-radius:20px;
background:#fff;
border:1px solid #dee2e6;
color:#6c757d;
font-size:12px;
font-weight:600;
}

.dimensions{
display:none;
gap:10px;
margin-top:10px;
}

.dimensions input{
width:48%;
padding:12px;
font-size:16px;
border:1px solid #dee2e6;
border-radius:8px;
}

img.preview{
width:100%;
max-height:400px;
object-fit:contain;
display:none;
margin-top:20px;
border-radius:10px;
}

button{
width:100%;
padding:15px;
background:#0d6efd;
color:#fff;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
margin-top:15px;
}

button:hover{
background:#0b5ed7;
}

#status{
margin-top:15px;
font-size:15px;
font-weight:600;
}

</style>

</head>

<body>

<div class="container">

<h1>
<i class="fa-solid fa-expand" style="color:#0d6efd;"></i>
Image Resizer
</h1>

<div class="upload-zone" id="dropZone">
    <div class="upload-icon">
        <i class="fa-solid fa-cloud-arrow-up"></i>
    </div>

    <div class="upload-title">
        Drag & Drop your image here
    </div>

    <div class="upload-subtitle">
        or click to choose an image
    </div>

    <div class="upload-formats">
        JPG / PNG / WEBP
    </div>

    <input type="file" id="upload" accept="image/*">
</div>

<div class="dimensions" id="dimensions">
    <input type="number" id="width" placeholder="Width (px)">
    <input type="number" id="height" placeholder="Height (px)">
</div>

<button id="resizeBtn" style="display:none;">Resize Image</button>

<img id="preview" class="preview" alt="Preview">

<button id="download" style="display:none;background:#198754;">Download</button>

<div id="status"></div>

</div>

<script>

const upload = document.getElementById("upload");
const preview = document.getElementById("preview");
const download = document.getElementById("download");
const status = document.getElementById("status");
const dropZone = document.getElementById("dropZone");
const dimensions = document.getElementById("dimensions");
const resizeBtn = document.getElementById("resizeBtn");
const widthInput = document.getElementById("width");
const heightInput = document.getElementById("height");

let uploadedImage = "";

function processFile(file){

    if(!file || !file.type.startsWith("image/")){
        status.innerText = "❌ Please select an image file.";
        status.style.color = "#dc3545";
        return;
    }

    status.innerText = "Reading image...";
    status.style.color = "#0d6efd";

    const reader = new FileReader();

    reader.onload = function(e){

        uploadedImage = e.target.result;

        const img = new Image();

        img.onload = function(){
            widthInput.value = img.width;
            heightInput.value = img.height;
            dimensions.style.display = "flex";
            resizeBtn.style.display = "block";
            status.innerText = "✅ Image loaded. Set dimensions and resize.";
            status.style.color = "#198754";
        };

        img.src = uploadedImage;

    };

    reader.onerror = function(){
        status.innerText = "❌ Could not read the image.";
        status.style.color = "#dc3545";
    };

    reader.readAsDataURL(file);

}

upload.addEventListener("change", function(){
    processFile(this.files[0]);
});

dropZone.addEventListener("dragover", function(e){
    e.preventDefault();
    dropZone.classList.add("dragover");
});

dropZone.addEventListener("dragleave", function(){
    dropZone.classList.remove("dragover");
});

dropZone.addEventListener("drop", function(e){
    e.preventDefault();
    dropZone.classList.remove("dragover");
    processFile(e.dataTransfer.files[0]);
});

resizeBtn.addEventListener("click", function(){

    const w = parseInt(widthInput.value);
    const h = parseInt(heightInput.value);

    if(!w || !h || w <= 0 || h <= 0){
        status.innerText = "❌ Please enter valid width and height.";
        status.style.color = "#dc3545";
        return;
    }

    const img = new Image();

    img.onload = function(){

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = w;
        canvas.height = h;

        ctx.drawImage(img, 0, 0, w, h);

        const data = canvas.toDataURL("image/png");

        preview.src = data;
        preview.style.display = "block";
        download.style.display = "block";

        download.onclick = function(){
            const a = document.createElement("a");
            a.href = data;
            a.download = "resized-image.png";
            a.click();
        };

        status.innerText = "🎉 Resized! Click Download.";
        status.style.color = "#198754";

    };

    img.src = uploadedImage;

});

</script>

</body>
</html>
