<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Background Remover - Free AI Photo Background Remover | BHARAT TOOLS</title>
    <meta name="description" content="Remove background from any photo instantly using AI. Free background remover, works in browser, no signup, no upload to server.">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #f4f7fb;
            color: #1a2b45;
        }
        header {
            background: linear-gradient(135deg, #2f6fed, #1a4fd6);
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header a.back {
            color: #fff;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
        }
        header .brand {
            color: #fff;
            font-weight: 700;
            font-size: 1.05rem;
        }
        main {
            max-width: 520px;
            margin: 0 auto;
            padding: 28px 18px 60px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 6px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #5c6b82;
            font-size: 0.92rem;
            margin-bottom: 24px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 22px 20px;
            box-shadow: 0 6px 24px rgba(26, 43, 69, 0.07);
        }
        .drop-zone {
            border: 2px dashed #c3cfe4;
            border-radius: 14px;
            padding: 34px 16px;
            text-align: center;
            cursor: pointer;
        }
        .drop-zone.dragover {
            border-color: #2f6fed;
            background: #eef4ff;
        }
        .drop-zone .icon {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        .drop-zone p {
            font-size: 0.9rem;
            color: #5c6b82;
        }
        .drop-zone p strong { color: #2f6fed; }
        input[type="file"] { display: none; }
        #canvas-wrap {
            display: none;
            margin-top: 16px;
            text-align: center;
            background: repeating-conic-gradient(#e5e9f0 0% 25%, #fff 0% 50%) 50% / 20px 20px;
            border-radius: 10px;
            padding: 8px;
        }
        #result-canvas {
            max-width: 100%;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }
        #process-btn {
            width: 100%;
            margin-top: 16px;
            background: #2f6fed;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 13px 0;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: none;
        }
        #process-btn:disabled { opacity: 0.6; }
        #download-btn {
            width: 100%;
            margin-top: 10px;
            background: #eef4ff;
            color: #1a4fd6;
            border: none;
            border-radius: 10px;
            padding: 12px 0;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: none;
        }
        #status {
            margin-top: 14px;
            font-size: 0.85rem;
            color: #5c6b82;
            text-align: center;
            display: none;
        }
        .privacy-note {
            margin-top: 18px;
            font-size: 0.78rem;
            color: #9aa6b8;
            text-align: center;
            line-height: 1.5;
        }
        footer {
            text-align: center;
            padding: 30px 20px;
            color: #9aa6b8;
            font-size: 0.82rem;
        }
    </style>
</head>

<body>

    <header>
        <a href="index.html" class="back">&larr; Back</a>
        <span class="brand">BHARAT TOOLS</span>
    </header>

    <main>
        <h1>🪄 Background Remover</h1>
        <p class="subtitle">Photo se background hatao, AI ke saath, seconds me.</p>

        <div class="card">
            <div class="drop-zone" id="drop-zone">
                <div class="icon">🧍</div>
                <p><strong>Click karo</strong> ya photo yahan drag-drop karo</p>
            </div>
            <input type="file" id="file-input" accept="image/*">

            <div id="canvas-wrap">
                <canvas id="result-canvas"></canvas>
            </div>

            <button type="button" id="process-btn">Background Hatao</button>
            <button type="button" id="download-btn">Download Photo</button>

            <p id="status"></p>

            <p class="privacy-note">Aapki photo kisi server pe upload nahi hoti — sab kuch aapke browser me hi process hota hai.</p>
        </div>
    </main>

    <footer>
        &copy; 2026 BHARAT TOOLS. All rights reserved.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.2.0/dist/body-pix.min.js"></script>
    <script>
        (function () {
            var dropZone = document.getElementById('drop-zone');
            var fileInput = document.getElementById('file-input');
            var canvasWrap = document.getElementById('canvas-wrap');
            var canvas = document.getElementById('result-canvas');
            var ctx = canvas.getContext('2d');
            var processBtn = document.getElementById('process-btn');
            var downloadBtn = document.getElementById('download-btn');
            var status = document.getElementById('status');

            var selectedImage = null;
            var bodyPixModel = null;

            dropZone.addEventListener('click', function () { fileInput.click(); });

            dropZone.addEventListener('dragover', function (e) {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });
            dropZone.addEventListener('dragleave', function () {
                dropZone.classList.remove('dragover');
            });
            dropZone.addEventListener('drop', function (e) {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                    handleFile(e.dataTransfer.files[0]);
                }
            });

            fileInput.addEventListener('change', function () {
                if (fileInput.files && fileInput.files[0]) {
                    handleFile(fileInput.files[0]);
                }
            });

            function handleFile(file) {
                if (!file.type.startsWith('image/')) return;
                var reader = new FileReader();
                reader.onload = function (e) {
                    var img = new Image();
                    img.onload = function () {
                        selectedImage = img;
                        var maxDim = 700;
                        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        canvasWrap.style.display = 'block';
                        processBtn.style.display = 'block';
                        downloadBtn.style.display = 'none';
                        status.style.display = 'none';
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            processBtn.addEventListener('click', function () {
                processBtn.disabled = true;
                status.style.display = 'block';
                status.textContent = 'AI model load ho raha hai (pehli baar thoda time lagta hai)...';

                var loadPromise = bodyPixModel ? Promise.resolve(bodyPixModel) : bodyPix.load({
                    architecture: 'MobileNetV1',
                    outputStride: 16,
                    multiplier: 0.75,
                    quantBytes: 2
                });

                loadPromise.then(function (model) {
                    bodyPixModel = model;
                    status.textContent = 'Background hata raha hai...';
                    return model.segmentPerson(canvas, {
                        internalResolution: 'medium',
                        segmentationThreshold: 0.7
                    });
                }).then(function (segmentation) {
                    var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    var pixels = imageData.data;
                    for (var i = 0; i < segmentation.data.length; i++) {
                        if (segmentation.data[i] === 0) {
                            pixels[i * 4 + 3] = 0;
                        }
                    }
                    ctx.putImageData(imageData, 0, 0);
                    status.style.display = 'none';
                    processBtn.disabled = false;
                    processBtn.style.display = 'none';
                    downloadBtn.style.display = 'block';
                }).catch(function () {
                    status.textContent = 'Kuch galat ho gaya, dobara try karo.';
                    processBtn.disabled = false;
                });
            });

            downloadBtn.addEventListener('click', function () {
                var link = document.createElement('a');
                link.download = 'background-removed.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        })();
    </script>

</body>
</html>
