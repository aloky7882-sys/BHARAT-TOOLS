<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word to PDF Converter - Bharat Tools</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<!-- Libraries with fallbacks -->
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg, #0d6efd, #4d9cff);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
background:#fff;
padding:40px;
border-radius:20px;
box-shadow:0 20px 60px rgba(0,0,0,.2);
width:100%;
max-width:700px;
text-align:center;
}

h1{
margin-bottom:8px;
color:#0d6efd;
}

.note{
font-size:13px;
color:#6c757d;
margin-bottom:20px;
}

.upload-zone{
position:relative;
border:2px dashed #0d6efd;
border-radius:12px;
padding:40px 20px;
margin:25px 0;
background:#f8f9fa;
cursor:pointer;
transition:all .3s ease;
overflow:hidden;
}

.upload-zone:hover,
.upload-zone.dragover{
background:#eef5ff;
border-color:#0b5ed7;
transform:translateY(-2px);
box-shadow:0 10px 25px rgba(13, 110, 253, 0.15);
}

.upload-zone input{
position:absolute;
inset:0;
width:100%;
height:100%;
opacity:0;
cursor:pointer;
margin:0;
}

.upload-icon{
width:76px;
height:76px;
margin:0 auto 14px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:#e7f0ff;
color:#0d6efd;
font-size:34px;
transition:transform .3s ease;
}

.upload-zone:hover .upload-icon{
transform:translateY(-5px) scale(1.1);
}

.upload-title{
font-size:18px;
font-weight:700;
color:#212529;
margin-bottom:6px;
}

.upload-subtitle{
font-size:14px;
color:#6c757d;
margin-bottom:10px;
}

.upload-formats{
display:inline-block;
padding:5px 10px;
border-radius:20px;
background:#fff;
border:1px solid #dee2e6;
color:#6c757d;
font-size:12px;
font-weight:600;
}

#previewWrapper{
display:none;
text-align:left;
max-height:400px;
overflow-y:auto;
border:1px solid #dee2e6;
border-radius:10px;
padding:20px;
margin-top:20px;
background:#fafbfc;
}

#previewWrapper img{
max-width:100%;
}

button{
width:100%;
padding:15px;
background:#0d6efd;
color:#fff;
border:none;
border-radius:8px;
font-size:17px;
font-weight:600;
cursor:pointer;
margin-top:15px;
transition:all .3s ease;
}

button:hover{
background:#0b5ed7;
transform:translateY(-2px);
box-shadow:0 10px 20px rgba(13, 110, 253, 0.3);
}

button:disabled{
opacity:0.6;
cursor:not-allowed;
}

#status{
margin-top:15px;
font-size:14px;
font-weight:600;
padding:12px;
border-radius:8px;
display:none;
}

#status.success{
background:#d4edda;
color:#155724;
display:block;
}

#status.error{
background:#f8d7da;
color:#721c24;
display:block;
}

#status.info{
background:#d1ecf1;
color:#0c5460;
display:block;
}
</style>

</head>

<body>

<div class="container">

<h1>
<i class="fa-solid fa-file-word" style="color:#0d6efd;"></i>
Word to PDF
</h1>

<p class="note">Simple text-based .docx files convert best. Complex layouts may simplify.</p>

<div class="upload-zone" id="dropZone">
    <div class="upload-icon">
        <i class="fa-solid fa-cloud-arrow-up"></i>
    </div>

    <div class="upload-title">
        Drag & Drop Word file here
    </div>

    <div class="upload-subtitle">
        or click to choose
    </div>

    <div class="upload-formats">
        DOCX
    </div>

    <input type="file" id="upload" accept=".docx">
</div>

<div id="previewWrapper"></div>

<button id="download" style="display:none;">Convert & Download PDF</button>

<div id="status"></div>

</div>

<script>

const upload = document.getElementById("upload");
const dropZone = document.getElementById("dropZone");
const previewWrapper = document.getElementById("previewWrapper");
const download = document.getElementById("download");
const statusEl = document.getElementById("status");

let selectedFile = null;
let convertedHTML = "";

function showStatus(message, type) {
    statusEl.className = type;
    statusEl.innerHTML = message;
}

function processFile(file){
    if(!file) return;

    if(file.type !== "application/vnd.openxmlformats-officedocument.wordprocessingml.document" && !file.name.toLowerCase().endsWith(".docx")){
        showStatus("❌ Please select a .docx file only.", "error");
        download.style.display = "none";
        previewWrapper.style.display = "none";
        return;
    }

    selectedFile = file;
    showStatus("📂 Reading your document...", "info");
    download.style.display = "none";

    if (typeof mammoth === "undefined") {
        showStatus("❌ Library loading failed. Refresh page and try again.", "error");
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e){
        try {
            mammoth.convertToHtml({ arrayBuffer: e.target.result })
                .then(function(result){
                    convertedHTML = result.value;
                    
                    if(!convertedHTML || convertedHTML.trim() === "") {
                        showStatus("❌ Document appears empty or corrupted.", "error");
                        return;
                    }

                    previewWrapper.innerHTML = convertedHTML;
                    previewWrapper.style.display = "block";
                    download.style.display = "block";

                    if(result.messages && result.messages.length > 0){
                        showStatus("✅ Loaded with formatting simplified.", "success");
                    } else {
                        showStatus("✅ Document ready! Click Convert to download PDF.", "success");
                    }
                })
                .catch(function(err){
                    console.error("Mammoth error:", err);
                    showStatus("❌ Could not read this file. Try a different one.", "error");
                });
        } catch(err) {
            console.error("Processing error:", err);
            showStatus("❌ Error processing file: " + err.message, "error");
        }
    };

    reader.onerror = function(){
        showStatus("❌ Failed to read file.", "error");
    };

    reader.readAsArrayBuffer(file);
}

upload.addEventListener("change", function(){
    processFile(this.files[0]);
});

dropZone.addEventListener("dragover", function(e){
    e.preventDefault();
    dropZone.classList.add("dragover");
});

dropZone.addEventListener("dragleave", function(){
    dropZone.classList.remove("dragover");
});

dropZone.addEventListener("drop", function(e){
    e.preventDefault();
    dropZone.classList.remove("dragover");
    processFile(e.dataTransfer.files[0]);
});

download.addEventListener("click", function(){
    if(!convertedHTML || !selectedFile){
        showStatus("❌ Please select a Word file first.", "error");
        return;
    }

    showStatus("⏳ Converting to PDF...", "info");
    download.disabled = true;

    if (typeof html2pdf === "undefined") {
        showStatus("❌ PDF library failed. Refresh and try again.", "error");
        download.disabled = false;
        return;
    }

    try {
        const fileName = selectedFile.name.replace(/\.docx$/i, "") + ".pdf";

        const opt = {
            margin: 15,
            filename: fileName,
            image: { type: "jpeg", quality: 0.95 },
            html2canvas: { scale: 2, useCORS: true, logging: false },
            jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
        };

        html2pdf()
            .set(opt)
            .from(previewWrapper)
            .save()
            .then(function(){
                showStatus("🎉 PDF downloaded successfully!", "success");
                download.disabled = false;
            })
            .catch(function(err){
                console.error("html2pdf error:", err);
                showStatus("❌ Conversion failed: " + err.message, "error");
                download.disabled = false;
            });
    } catch(err) {
        console.error("Error:", err);
        showStatus("❌ Error: " + err.message, "error");
        download.disabled = false;
    }
});

</script>

</body>
</html>
