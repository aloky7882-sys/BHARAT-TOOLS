<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Cropper - Bharat Tools</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
background:#fff;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
max-width:700px;
width:100%;
}

h1{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
margin:10px 0;
padding:10px;
}

button{
width:100%;
padding:15px;
margin-top:15px;
background:#0d6efd;
color:#fff;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

canvas{
width:100%;
margin-top:20px;
border:1px solid #ddd;
}

</style>

</head>

<body>

<div class="container">

<h1>✂️ Image Cropper</h1>

<input type="file" id="upload" accept="image/*">

<input type="number" id="x" placeholder="Start X">

<input type="number" id="y" placeholder="Start Y">

<input type="number" id="w" placeholder="Crop Width">

<input type="number" id="h" placeholder="Crop Height">

<button onclick="cropImage()">Crop Image</button>

<canvas id="canvas"></canvas>

<button id="download" style="display:none;">Download</button>

</div>

<script>

let image=new Image();

document.getElementById("upload").onchange=function(e){

const file=e.target.files[0];

const reader=new FileReader();

reader.onload=function(event){

image.src=event.target.result;

}

reader.readAsDataURL(file);

}

function cropImage(){

const canvas=document.getElementById("canvas");

const ctx=canvas.getContext("2d");

const x=parseInt(document.getElementById("x").value);
const y=parseInt(document.getElementById("y").value);
const w=parseInt(document.getElementById("w").value);
const h=parseInt(document.getElementById("h").value);

canvas.width=w;
canvas.height=h;

ctx.drawImage(image,x,y,w,h,0,0,w,h);

document.getElementById("download").style.display="block";

document.getElementById("download").onclick=function(){

const a=document.createElement("a");

a.href=canvas.toDataURL();

a.download="cropped-image.png";

a.click();

}

}

</script>

</body>
</html>
