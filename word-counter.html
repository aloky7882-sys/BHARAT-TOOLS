<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Counter - Bharat Tools</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6fb;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.1);
width:100%;
max-width:700px;
}

h1{
text-align:center;
margin-bottom:20px;
}

textarea{
width:100%;
height:220px;
padding:15px;
font-size:16px;
border:1px solid #ddd;
border-radius:10px;
resize:none;
outline:none;
}

.result{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
margin-top:25px;
}

.box{
background:#0d6efd;
color:white;
padding:20px;
border-radius:10px;
text-align:center;
font-size:20px;
}

@media(max-width:600px){

.result{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<div class="container">

<h1>📝 Word Counter</h1>

<textarea id="text" placeholder="Type or paste your text here..."></textarea>

<div class="result">

<div class="box">
Words
<h2 id="words">0</h2>
</div>

<div class="box">
Characters
<h2 id="characters">0</h2>
</div>

<div class="box">
Sentences
<h2 id="sentences">0</h2>
</div>

<div class="box">
Paragraphs
<h2 id="paragraphs">0</h2>
</div>

</div>

</div>

<script>

const text=document.getElementById("text");

text.addEventListener("input",()=>{

let value=text.value;

document.getElementById("characters").innerHTML=value.length;

let words=value.trim().split(/\s+/).filter(word=>word!="");

document.getElementById("words").innerHTML=words.length;

let sentence=value.split(/[.!?]+/).filter(s=>s.trim()!="");

document.getElementById("sentences").innerHTML=sentence.length;

let para=value.split(/\n+/).filter(p=>p.trim()!="");

document.getElementById("paragraphs").innerHTML=para.length;

});

</script>

</body>
</html>
