<!DOCTYPE html>
<html>
<head>
<title>Age Calculator - Alok Tools</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:#f2f2f2;
    padding:30px;
}

.box{
    background:white;
    max-width:400px;
    margin:auto;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px #aaa;
}

input,button{
    width:90%;
    padding:12px;
    margin:10px;
    font-size:16px;
}

button{
    background:#0066ff;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

#result{
    font-size:20px;
    margin-top:20px;
}
</style>

</head>

<body>

<div class="box">

<h2>Age Calculator</h2>

<p>Enter your Date of Birth</p>

<input type="date" id="dob">

<button onclick="calculateAge()">Calculate Age</button>

<div id="result"></div>

</div>


<script>

function calculateAge(){

let dob = document.getElementById("dob").value;

if(dob==""){
alert("Please select your date of birth");
return;
}

let birthDate = new Date(dob);
let today = new Date();

let age = today.getFullYear() - birthDate.getFullYear();

let month = today.getMonth() - birthDate.getMonth();

if(month < 0 || (month === 0 && today.getDate() < birthDate.getDate())){
age--;
}

document.getElementById("result").innerHTML =
"Your Age is: " + age + " Years";

}

</script>

</body>
</html>
