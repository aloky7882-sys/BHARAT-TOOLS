<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JPG to PDF - Bharat Tools</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6fb;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
background:#fff;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
width:100%;
max-width:700px;
text-align:center;
}

h1{
margin-bottom:20px;
}

input{
margin:20px 0;
width:100%;
}

img{
width:100%;
max-height:400px;
object-fit:contain;
display:none;
margin-top:20px;
border-radius:10px;
}

button{
width:100%;
padding:15px;
background:#0d6efd;
color:#fff;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
margin-top:20px;
}

button:hover{
background:#0b5ed7;
}

</style>

</head>

<body>

<div class="container">

<h1>📄 JPG to PDF Converter</h1>

<input type="file" id="upload" accept="image/jpeg,image/jpg">

<img id="preview">

<button id="download" style="display:none;">
Convert & Download PDF
</button>

</div>

<script>

let imageData="";

const upload=document.getElementById("upload");
const preview=document.getElementById("preview");
const download=document.getElementById("download");

upload.onchange=function(){

const file=this.files[0];

if(!file) return;

const reader=new FileReader();

reader.onload=function(e){

imageData=e.target.result;

preview.src=imageData;
preview.style.display="block";

download.style.display="block";

}

reader.readAsDataURL(file);

}

download.onclick=function(){

const {jsPDF}=window.jspdf;

const pdf=new jsPDF();

const img=new Image();

img.onload=function(){

const pageWidth=210;
const pageHeight=(img.height*pageWidth)/img.width;

pdf.addImage(imageData,"JPEG",0,0,pageWidth,pageHeight);

pdf.save("bharat-tools.pdf");

}

img.src=imageData;

}

</script>

</body>
</html>
