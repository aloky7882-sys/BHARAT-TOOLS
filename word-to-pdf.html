<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word to PDF Converter - Bharat Tools</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<!-- mammoth.js: reads .docx and converts to HTML -->
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>

<!-- html2pdf.js: renders HTML to a downloadable PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6fb;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
background:#fff;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
width:100%;
max-width:700px;
text-align:center;
}

h1{
margin-bottom:8px;
}

.note{
font-size:13px;
color:#6c757d;
margin-bottom:20px;
}

.upload-zone{
position:relative;
border:2px dashed #0d6efd;
border-radius:12px;
padding:32px 20px;
margin:20px 0;
background:#f8f9fa;
cursor:pointer;
transition:all .2s ease;
overflow:hidden;
}

.upload-zone:hover,
.upload-zone.dragover{
background:#eef5ff;
border-color:#0b5ed7;
transform:translateY(-1px);
}

.upload-zone input{
position:absolute;
inset:0;
width:100%;
height:100%;
opacity:0;
cursor:pointer;
margin:0;
}

.upload-icon{
width:76px;
height:76px;
margin:0 auto 14px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:#e7f0ff;
color:#0d6efd;
font-size:34px;
transition:transform .2s ease;
}

.upload-zone:hover .upload-icon{
transform:translateY(-3px);
}

.upload-title{
font-size:18px;
font-weight:700;
color:#212529;
margin-bottom:6px;
}

.upload-subtitle{
font-size:14px;
color:#6c757d;
margin-bottom:10px;
}

.upload-formats{
display:inline-block;
padding:5px 10px;
border-radius:20px;
background:#fff;
border:1px solid #dee2e6;
color:#6c757d;
font-size:12px;
font-weight:600;
}

#previewWrapper{
display:none;
text-align:left;
max-height:400px;
overflow-y:auto;
border:1px solid #dee2e6;
border-radius:10px;
padding:20px;
margin-top:20px;
background:#fafbfc;
}

#previewWrapper img{
max-width:100%;
}

button{
width:100%;
padding:15px;
background:#0d6efd;
color:#fff;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
margin-top:20px;
}

button:hover{
background:#0b5ed7;
}

#status{
margin-top:15px;
font-size:15px;
font-weight:600;
}

</style>

</head>

<body>

<div class="container">

<h1>
<i class="fa-solid fa-file-word" style="color:#0d6efd;"></i>
Word to PDF Converter
</h1>

<p class="note">Works best with simple, text-based .docx files. Complex layouts (columns, headers/footers) may not carry over exactly.</p>

<div class="upload-zone" id="dropZone">
    <div class="upload-icon">
        <i class="fa-solid fa-cloud-arrow-up"></i>
    </div>

    <div class="upload-title">
        Drag & Drop your Word file here
    </div>

    <div class="upload-subtitle">
        or click to choose a file
    </div>

    <div class="upload-formats">
        DOCX
    </div>

    <input type="file" id="upload" accept=".docx">
</div>

<div id="previewWrapper"></div>

<button id="download" style="display:none;">Convert & Download PDF</button>

<div id="status"></div>

</div>

<script>
window.addEventListener('error', function(e) {
    var box = document.createElement('div');
    box.style.cssText = 'background:#dc3545;color:#fff;padding:14px;margin:15px 0;border-radius:8px;font-size:14px;text-align:left;word-break:break-word;';
    box.textContent = '⚠️ ERROR: ' + e.message + ' (line ' + e.lineno + ')';
    document.querySelector('.container').prepend(box);
});
window.addEventListener('unhandledrejection', function(e) {
    var box = document.createElement('div');
    box.style.cssText = 'background:#dc3545;color:#fff;padding:14px;margin:15px 0;border-radius:8px;font-size:14px;text-align:left;word-break:break-word;';
    box.textContent = '⚠️ PROMISE ERROR: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
    document.querySelector('.container').prepend(box);
});
</script>

<script>

const upload = document.getElementById("upload");
const dropZone = document.getElementById("dropZone");
const previewWrapper = document.getElementById("previewWrapper");
const download = document.getElementById("download");
const statusEl = document.getElementById("status");

if (typeof mammoth === "undefined" || typeof html2pdf === "undefined") {
    document.querySelector(".container").insertAdjacentHTML("afterbegin", '<div style="background:#dc3545;color:#fff;padding:14px;margin-bottom:15px;border-radius:8px;font-size:14px;">⚠️ Zaroori library load nahi ho payi. Internet check karo, ad-blocker off karo, ya page refresh karo.</div>');
}

let selectedFile = null;
let convertedHTML = "";

function processFile(file){

    if(!file){
        return;
    }

    if(
        file.type !== "application/vnd.openxmlformats-officedocument.wordprocessingml.document" &&
        !file.name.toLowerCase().endsWith(".docx")
    ){
        statusEl.innerText = "❌ Please select a .docx file. (Old .doc format is not supported.)";
        statusEl.style.color = "#dc3545";
        download.style.display = "none";
        previewWrapper.style.display = "none";
        return;
    }

    selectedFile = file;
    statusEl.innerText = "Reading document...";
    statusEl.style.color = "#0d6efd";
    download.style.display = "none";

    if (typeof mammoth === "undefined") {
        statusEl.innerText = "❌ Document reading library load nahi ho payi. Internet check karo, ad-blocker off karo, ya page refresh karo.";
        statusEl.style.color = "#dc3545";
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e){

        mammoth.convertToHtml({ arrayBuffer: e.target.result })
            .then(function(result){

                convertedHTML = result.value;
                previewWrapper.innerHTML = convertedHTML;
                previewWrapper.style.display = "block";

                download.style.display = "block";

                if(result.messages && result.messages.length > 0){
                    statusEl.innerText = "✅ Loaded with some formatting simplified. Preview below, then convert.";
                } else {
                    statusEl.innerText = "✅ Document loaded. Preview below, then convert.";
                }
                statusEl.style.color = "#198754";

            })
            .catch(function(err){
                console.error(err);
                statusEl.innerText = "❌ Could not read this .docx file.";
                statusEl.style.color = "#dc3545";
            });

    };

    reader.onerror = function(){
        statusEl.innerText = "❌ Could not read the file.";
        statusEl.style.color = "#dc3545";
    };

    reader.readAsArrayBuffer(file);

}

upload.addEventListener("change", function(){
    processFile(this.files[0]);
});

dropZone.addEventListener("dragover", function(e){
    e.preventDefault();
    dropZone.classList.add("dragover");
});

dropZone.addEventListener("dragleave", function(){
    dropZone.classList.remove("dragover");
});

dropZone.addEventListener("drop", function(e){
    e.preventDefault();
    dropZone.classList.remove("dragover");
    processFile(e.dataTransfer.files[0]);
});

download.addEventListener("click", function(){

    if(!convertedHTML || !selectedFile){
        statusEl.innerText = "❌ Please select a Word file first.";
        statusEl.style.color = "#dc3545";
        return;
    }

    statusEl.innerText = "Converting to PDF... please wait.";
    statusEl.style.color = "#0d6efd";
    download.disabled = true;

    if (typeof html2pdf === "undefined") {
        statusEl.innerText = "❌ PDF conversion library load nahi ho payi. Internet check karo, ad-blocker off karo, ya page refresh karo.";
        statusEl.style.color = "#dc3545";
        download.disabled = false;
        return;
    }

    const fileName = selectedFile.name.replace(/\.docx$/i, "") + ".pdf";

    const opt = {
        margin: 15,
        filename: fileName,
        image: { type: "jpeg", quality: 0.95 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
    };

    html2pdf()
        .set(opt)
        .from(previewWrapper)
        .save()
        .then(function(){
            statusEl.innerText = "🎉 PDF downloaded successfully!";
            statusEl.style.color = "#28a745";
            download.disabled = false;
        })
        .catch(function(err){
            console.error(err);
            statusEl.innerText = "❌ PDF conversion failed: " + err.message;
            statusEl.style.color = "#dc3545";
            download.disabled = false;
        });

});

</script>

</body>
</html>
