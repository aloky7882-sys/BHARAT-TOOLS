<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EMI Calculator - BHARAT TOOLS</title>

<style>

body{
    font-family:Arial, sans-serif;
    background:#f2f2f2;
    text-align:center;
    padding:30px;
}

.container{
    background:white;
    max-width:450px;
    margin:auto;
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 10px #aaa;
}

h1{
    color:#0066ff;
}

input{
    width:90%;
    padding:12px;
    margin:10px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:90%;
    padding:12px;
    background:#0066ff;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#004dcc;
}

#result{
    margin-top:20px;
    font-size:18px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>💰 EMI Calculator</h1>

<p>Calculate Your Loan EMI</p>

<input type="number" id="amount" placeholder="Loan Amount">

<input type="number" id="rate" placeholder="Interest Rate (%)">

<input type="number" id="time" placeholder="Loan Tenure (Years)">


<button onclick="calculateEMI()">Calculate EMI</button>


<div id="result"></div>


</div>


<script>

function calculateEMI(){

let principal = document.getElementById("amount").value;
let rate = document.getElementById("rate").value;
let years = document.getElementById("time").value;


if(principal=="" || rate=="" || years==""){
    alert("Please fill all details");
    return;
}


let monthlyRate = rate / 12 / 100;

let months = years * 12;


let emi = (principal * monthlyRate * Math.pow(1 + monthlyRate, months)) /
(Math.pow(1 + monthlyRate, months) - 1);


document.getElementById("result").innerHTML =
"Monthly EMI: ₹ " + emi.toFixed(2);

}

</script>


</body>
</html>
