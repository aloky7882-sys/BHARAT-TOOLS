<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Excel to PDF Converter - BHARAT TOOLS</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Excel Library -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- jsPDF fallback -->
    <script>
        if (!window.jspdf || !window.jspdf.jsPDF) {
            document.write(
                '<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"><\/script>'
            );
        }
    </script>

    <style>
        .converter-box { 
            max-width: 650px; 
            margin: 80px auto; 
            padding: 40px 30px; 
            background: #fff; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            text-align: center; 
        }

        .upload-zone { 
            border: 2px dashed #0d6efd; 
            padding: 50px 20px; 
            border-radius: 12px; 
            background: #f8f9fa; 
            cursor: pointer; 
            margin: 25px 0; 
            position: relative;
            transition: 0.3s;
        }

        .upload-zone:hover {
            background: #f1f3f5;
            border-color: #0b5ed7;
        }

        .upload-zone.dragover {
            background: #eef5ff;
            border-color: #0b5ed7;
        }

        .excel-upload-icon {
            width: 76px;
            height: 76px;
            margin: 0 auto 14px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e7f0ff;
            color: #0d6efd;
            font-size: 34px;
            transition: transform .2s ease;
        }

        .upload-zone:hover .excel-upload-icon {
            transform: translateY(-3px);
        }

        .upload-title {
            font-size: 18px;
            font-weight: 700;
            color: #212529;
            margin-bottom: 6px;
        }

        .upload-subtitle {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 10px;
        }

        .upload-formats {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: #fff;
            border: 1px solid #dee2e6;
            color: #6c757d;
            font-size: 12px;
            font-weight: 600;
        }


        .upload-zone input { 
            position: absolute; 
            top: 0;
            left: 0;
            width: 100%;
            height: 100%; 
            opacity: 0;
            cursor: pointer; 
        }

        .action-btn { 
            background: #0d6efd;
            color: #fff;
            border: none; 
            padding: 14px 30px;
            font-size: 16px;
            border-radius: 8px; 
            cursor: pointer;
            display: none;
            margin: 20px auto; 
            font-weight: 600;
            width: 100%;
            transition: 0.2s;
        }

        .action-btn:hover {
            background: #0b5ed7;
        }

        #status {
            margin-top: 15px;
            font-weight: 600;
            color: #0d6efd;
            font-size: 15px;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #6c757d;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            color: #212529;
        }

        /* PDF Table */
        #hidden-pdf-render {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 700px;
            background: #fff;
        }

        .pro-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 11px;
            margin: 20px 0;
            background: #fff;
        }

        .pro-table th {
            background-color: #0d6efd;
            color: white;
            font-weight: bold;
            border: 1px solid #dee2e6;
            padding: 10px 8px;
            text-align: left;
        }

        .pro-table td {
            border: 1px solid #dee2e6;
            padding: 8px;
            color: #333;
            text-align: left;
        }

        .pro-table tr:nth-child(even) {
            background-color: #f8f9fa;
        }
    </style>
</head>

<body>

    <div class="converter-box">

        <div style="font-size: 55px; margin-bottom: 15px; color: #0d6efd;">
            <i class="fa-solid fa-file-excel"></i>
        </div>

        <h2>Excel to PDF Converter</h2>

        <p style="color: #6c757d;">
            Convert Excel spreadsheets (.xlsx, .xls) into clean, professional PDF documents instantly.
        </p>

        <div class="upload-zone" id="drop-zone">

            <div class="excel-upload-icon">
                <i class="fa-solid fa-cloud-arrow-up"></i>
            </div>

            <div class="upload-title">
                Drag & Drop your Excel here
            </div>

            <div class="upload-subtitle">
                or click to choose an Excel file
            </div>

            <div class="upload-formats">
                XLS / XLSX
            </div>

            <input
                type="file"
                id="excel-file"
                accept=".xlsx,.xls,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
            />

        </div>

        <div id="file-name"
            style="margin-bottom: 20px; font-weight: 600; color: #198754; font-size: 14px;">
        </div>

        <button class="action-btn" id="convert-btn">
            Convert & Download PDF
        </button>

        <div id="status"></div>

        <a href="index.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Home
        </a>

    </div>


    <!-- Hidden Excel Table -->

    <div id="hidden-pdf-render">
        <table id="target-excel-table" class="pro-table"></table>
    </div>


    <script>

        let outputFileName = "converted-document.pdf";
        let selectedFile = null;

        const fileInput =
            document.getElementById("excel-file");

        const fileNameBox =
            document.getElementById("file-name");

        const convertBtn =
            document.getElementById("convert-btn");

        const statusBox =
            document.getElementById("status");

        const table =
            document.getElementById("target-excel-table");


        const dropZone = document.getElementById("drop-zone");

        function processExcelFile(file) {

            if (!file) return;

            const name = file.name.toLowerCase();

            if (
                !name.endsWith(".xlsx") &&
                !name.endsWith(".xls")
            ) {
                statusBox.innerText =
                    "❌ Please select a valid Excel file (.xlsx or .xls).";
                statusBox.style.color = "#dc3545";
                convertBtn.style.display = "none";
                return;
            }

            selectedFile = file;

            outputFileName =
                file.name.replace(/\.[^/.]+$/, "") + ".pdf";

            fileNameBox.innerHTML =
                '<i class="fa-solid fa-circle-check"></i> Selected: ' +
                file.name;

            fileNameBox.style.color = "#198754";

            convertBtn.style.display = "block";

            if (typeof XLSX === "undefined") {
                statusBox.innerText =
                    "❌ Excel library failed to load.";
                statusBox.style.color = "#dc3545";
                return;
            }

            statusBox.innerText =
                "Reading Excel file...";
            statusBox.style.color = "#0d6efd";

            const reader = new FileReader();

            reader.onload = function(event) {

                try {

                    const data =
                        new Uint8Array(event.target.result);

                    const workbook =
                        XLSX.read(data, {
                            type: "array",
                            cellDates: true
                        });

                    if (
                        !workbook.SheetNames ||
                        workbook.SheetNames.length === 0
                    ) {
                        throw new Error("No worksheet found.");
                    }

                    const worksheet =
                        workbook.Sheets[workbook.SheetNames[0]];

                    const json =
                        XLSX.utils.sheet_to_json(
                            worksheet,
                            {
                                header: 1,
                                defval: "",
                                raw: false
                            }
                        );

                    if (!json.length) {
                        throw new Error("Excel sheet is empty.");
                    }

                    table.innerHTML = "";

                    let maxColumns = 0;

                    json.forEach(row => {
                        if (Array.isArray(row) && row.length > maxColumns) {
                            maxColumns = row.length;
                        }
                    });

                    json.forEach((row, rowIndex) => {

                        const tr = document.createElement("tr");

                        for (let i = 0; i < maxColumns; i++) {

                            const cell =
                                rowIndex === 0
                                    ? document.createElement("th")
                                    : document.createElement("td");

                            cell.textContent =
                                row[i] == null ? "" : String(row[i]);

                            tr.appendChild(cell);
                        }

                        table.appendChild(tr);
                    });

                    statusBox.innerText =
                        "✅ Excel file ready. Click Convert & Download PDF.";
                    statusBox.style.color = "#198754";

                } catch (error) {

                    console.error(error);

                    statusBox.innerText =
                        "❌ Could not read Excel file.";
                    statusBox.style.color = "#dc3545";
                }
            };

            reader.onerror = function() {

                statusBox.innerText =
                    "❌ Could not read Excel file.";
                statusBox.style.color = "#dc3545";
            };

            reader.readAsArrayBuffer(file);
        }

        fileInput.addEventListener("change", function(e) {
            processExcelFile(e.target.files[0]);
        });

        dropZone.addEventListener("dragover", function(e) {
            e.preventDefault();
            dropZone.classList.add("dragover");
        });

        dropZone.addEventListener("dragleave", function() {
            dropZone.classList.remove("dragover");
        });

        dropZone.addEventListener("drop", function(e) {
            e.preventDefault();
            dropZone.classList.remove("dragover");
            processExcelFile(e.dataTransfer.files[0]);
        });

        /* =========================================
           SELECT EXCEL
        ========================================= */

        /* =========================================
           EXCEL → PDF
        ========================================= */

        convertBtn.addEventListener("click", function() {

            if (!selectedFile) {

                statusBox.innerText =
                    "❌ Please select an Excel file first.";

                statusBox.style.color =
                    "#dc3545";

                return;
            }


            if (!table.rows.length) {

                statusBox.innerText =
                    "❌ Excel data is not available.";

                statusBox.style.color =
                    "#dc3545";

                return;
            }


            /* Check jsPDF */

            if (
                !window.jspdf ||
                !window.jspdf.jsPDF
            ) {

                statusBox.innerText =
                    "❌ PDF library failed to load. Please refresh the page.";

                statusBox.style.color =
                    "#dc3545";

                console.error(
                    "jsPDF library not loaded."
                );

                return;
            }


            statusBox.innerText =
                "Converting... Please wait.";

            statusBox.style.color =
                "#0d6efd";


            try {

                const { jsPDF } =
                    window.jspdf;


                /* =================================
                   CREATE PDF
                ================================= */

                const doc =
                    new jsPDF({
                        orientation: "landscape",
                        unit: "pt",
                        format: "a4"
                    });


                const pageWidth =
                    doc.internal.pageSize.getWidth();

                const pageHeight =
                    doc.internal.pageSize.getHeight();


                const margin = 25;

                const usableWidth =
                    pageWidth - (margin * 2);


                const rows =
                    table.rows;


                const columnCount =
                    rows[0].cells.length;


                /* =================================
                   FIND COLUMN WIDTHS
                ================================= */

                let columnWidths =
                    new Array(columnCount).fill(0);


                for (
                    let c = 0;
                    c < columnCount;
                    c++
                ) {

                    let maxLength = 5;


                    for (
                        let r = 0;
                        r < rows.length;
                        r++
                    ) {

                        const text =
                            rows[r]
                                .cells[c]
                                .innerText
                                .trim();


                        if (
                            text.length > maxLength
                        ) {

                            maxLength =
                                text.length;
                        }

                    }


                    columnWidths[c] =
                        Math.min(
                            maxLength * 4.5 + 15,
                            140
                        );

                }


                /* Scale columns to page */

                let totalWidth =
                    columnWidths.reduce(
                        (a, b) => a + b,
                        0
                    );


                if (
                    totalWidth >
                    usableWidth
                ) {

                    const scale =
                        usableWidth /
                        totalWidth;


                    columnWidths =
                        columnWidths.map(
                            width =>
                                width * scale
                        );

                }


                /* =================================
                   DRAW TABLE
                ================================= */

                let y = margin;

                const baseRowHeight = 22;


                doc.setFont(
                    "helvetica",
                    "normal"
                );


                for (
                    let r = 0;
                    r < rows.length;
                    r++
                ) {

                    const row =
                        rows[r];


                    let x =
                        margin;


                    /* Calculate row height */

                    let maxLines = 1;


                    for (
                        let c = 0;
                        c < columnCount;
                        c++
                    ) {

                        const text =
                            row.cells[c]
                                .innerText
                                .trim();


                        const lines =
                            doc.splitTextToSize(
                                text,
                                Math.max(
                                    columnWidths[c] - 8,
                                    20
                                )
                            );


                        if (
                            lines.length >
                            maxLines
                        ) {

                            maxLines =
                                lines.length;
                        }

                    }


                    const rowHeight =
                        Math.max(
                            baseRowHeight,
                            maxLines * 12 + 10
                        );


                    /* New page */

                    if (
                        y + rowHeight >
                        pageHeight - margin
                    ) {

                        doc.addPage();

                        y = margin;

                    }


                    /* Draw cells */

                    for (
                        let c = 0;
                        c < columnCount;
                        c++
                    ) {

                        const cell =
                            row.cells[c];


                        const text =
                            cell.innerText
                                .trim();


                        const width =
                            columnWidths[c];


                        /* Header */

                        if (r === 0) {

                            doc.setFillColor(
                                13,
                                110,
                                253
                            );

                            doc.setTextColor(
                                255,
                                255,
                                255
                            );

                            doc.setFont(
                                "helvetica",
                                "bold"
                            );

                        }

                        /* Alternate rows */

                        else {

                            if (r % 2 === 0) {

                                doc.setFillColor(
                                    248,
                                    249,
                                    250
                                );

                                doc.setTextColor(
                                    51,
                                    51,
                                    51
                                );

                            }
                            else {

                                doc.setFillColor(
                                    255,
                                    255,
                                    255
                                );

                                doc.setTextColor(
                                    51,
                                    51,
                                    51
                                );

                            }

                            doc.setFont(
                                "helvetica",
                                "normal"
                            );

                        }


                        /* Cell background */

                        doc.rect(
                            x,
                            y,
                            width,
                            rowHeight,
                            "F"
                        );


                        /* Cell border */

                        doc.setDrawColor(
                            222,
                            226,
                            230
                        );


                        doc.rect(
                            x,
                            y,
                            width,
                            rowHeight
                        );


                        /* Text */

                        const lines =
                            doc.splitTextToSize(
                                text,
                                Math.max(
                                    width - 8,
                                    20
                                )
                            );

                        const textY =
                            y + (rowHeight - (lines.length * 12)) / 2 + 9;

                        doc.text(
                            lines,
                            x + 4,
                            textY
                        );

                        x += width;

                    }

                    y += rowHeight;

                }

                /* =================================
                   SAVE / DOWNLOAD PDF
                ================================= */

                const blob = doc.output("blob");

                if (!blob || blob.size < 100) {
                    throw new Error("PDF could not be created.");
                }

                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");

                link.href = url;
                link.download = outputFileName;
                link.style.display = "none";

                document.body.appendChild(link);
                link.click();

                setTimeout(function () {
                    link.remove();
                }, 1000);

                statusBox.innerText =
                    "🎉 PDF created successfully! If download did not start, tap Open PDF.";
                statusBox.style.color = "#28a745";

                const oldOpen = document.getElementById("openPdfBtn");
                if (oldOpen) oldOpen.remove();

                const openBtn = document.createElement("button");
                openBtn.id = "openPdfBtn";
                openBtn.type = "button";
                openBtn.innerText = "📄 Open PDF";
                openBtn.className = "action-btn";
                openBtn.style.display = "block";
                openBtn.style.background = "#198754";
                openBtn.style.marginTop = "10px";

                openBtn.onclick = function () {
                    window.open(url, "_blank");
                };

                statusBox.insertAdjacentElement("afterend", openBtn);

            } catch (error) {

                console.error("PDF creation error:", error);

                statusBox.innerText =
                    "❌ PDF conversion failed: " + error.message;

                statusBox.style.color = "#dc3545";

            }

        });

    </script>

</body>
</html>
