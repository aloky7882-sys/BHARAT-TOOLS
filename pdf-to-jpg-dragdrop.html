<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF to JPG - Bharat Tools</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6fb;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
background:#fff;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
max-width:800px;
width:100%;
text-align:center;
}

h1{
margin-bottom:20px;
}

input{margin:20px 0;width:100%;}
.upload-zone{position:relative;border:2px dashed #0d6efd;border-radius:12px;padding:32px 20px;margin:20px 0;background:#f8f9fa;cursor:pointer;transition:.2s;overflow:hidden}
.upload-zone:hover,.upload-zone.dragover{background:#eef5ff;border-color:#0b5ed7}
.upload-zone input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0}
.upload-icon{width:76px;height:76px;margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e7f0ff;color:#0d6efd;font-size:34px}
.upload-title{font-size:18px;font-weight:700;color:#212529;margin-bottom:6px}
.upload-subtitle{font-size:14px;color:#6c757d;margin-bottom:10px}
.upload-formats{display:inline-block;padding:5px 10px;border-radius:20px;background:#fff;border:1px solid #dee2e6;color:#6c757d;font-size:12px;font-weight:600}
#file-name{margin-top:8px;font-weight:600;color:#198754;font-size:14px}
#status{margin-top:10px;font-weight:600;font-size:14px}

canvas{
max-width:100%;
border:1px solid #ddd;
margin-top:20px;
}

button{
margin-top:20px;
padding:15px 25px;
background:#0d6efd;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:17px;
}

button:hover{
background:#084298;
}

</style>

</head>

<body>

<div class="container">

<h1><i class="fa-solid fa-file-pdf" style="color:#0d6efd;"></i> PDF to JPG Converter</h1>
<div class="upload-zone" id="dropZone">
<div class="upload-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
<div class="upload-title">Drag & Drop your PDF here</div>
<div class="upload-subtitle">or click to choose a PDF file</div>
<div class="upload-formats">PDF</div>
<input type="file" id="upload" accept=".pdf,application/pdf">
</div>
<div id="file-name"></div>
<div id="status"></div>
<canvas id="canvas"></canvas>
<br>
<button id="download" style="display:none;"><i class="fa-solid fa-download"></i> Download JPG</button>

</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const upload=document.getElementById("upload"),dropZone=document.getElementById("dropZone"),canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d"),download=document.getElementById("download"),fileNameBox=document.getElementById("file-name"),status=document.getElementById("status");
let selectedFile=null;
async function processPDF(file){
if(!file)return;
if(file.type!=="application/pdf"&&!file.name.toLowerCase().endsWith(".pdf")){status.innerText="❌ Please select a PDF file.";status.style.color="#dc3545";download.style.display="none";return;}
selectedFile=file;fileNameBox.innerHTML='<i class="fa-solid fa-circle-check"></i> Selected: '+file.name;status.innerText="Loading PDF...";status.style.color="#0d6efd";download.style.display="none";
try{
const data=new Uint8Array(await file.arrayBuffer()),pdf=await pdfjsLib.getDocument({data}).promise,page=await pdf.getPage(1),viewport=page.getViewport({scale:2});
canvas.width=viewport.width;canvas.height=viewport.height;
await page.render({canvasContext:ctx,viewport}).promise;
download.style.display="inline-block";status.innerText="✅ PDF ready. Page 1 of "+pdf.numPages+" is ready to download.";status.style.color="#198754";
}catch(e){console.error(e);status.innerText="❌ Could not read this PDF file.";status.style.color="#dc3545";}
}
upload.addEventListener("change",()=>processPDF(upload.files[0]));
dropZone.addEventListener("dragover",e=>{e.preventDefault();dropZone.classList.add("dragover")});
dropZone.addEventListener("dragleave",()=>dropZone.classList.remove("dragover"));
dropZone.addEventListener("drop",e=>{e.preventDefault();dropZone.classList.remove("dragover");processPDF(e.dataTransfer.files[0])});
download.addEventListener("click",()=>{
if(!selectedFile||!canvas.width)return;
const a=document.createElement("a");a.href=canvas.toDataURL("image/jpeg",.95);a.download=selectedFile.name.replace(/\.pdf$/i,"")+"-page-1.jpg";a.click();
status.innerText="🎉 JPG Downloaded Successfully!";status.style.color="#28a745";
});
</script>>

</body>
</html>
