<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Compressor - BHARAT TOOLS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fb, #e8ecf1);
            min-height: 100vh;
            padding: 20px;
        }

        .navbar {
            position: sticky;
            top: 0;
            width: 100%;
            background: linear-gradient(135deg, #0d6efd, #084298);
            padding: 15px 5%;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            z-index: 999;
            border-radius: 0 0 12px 12px;
        }

        .navbar h2 {
            color: #fff;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar i {
            font-size: 28px;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            background: #fff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 48px;
            color: #0d6efd;
            margin-bottom: 12px;
            font-weight: 800;
        }

        .header p {
            font-size: 18px;
            color: #666;
            max-width: 600px;
            margin: auto;
        }

        /* Upload Zone */
        .upload-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
            align-items: start;
        }

        .drop-area {
            position: relative;
            background: linear-gradient(135deg, #f8f9fa, #eef5ff);
            border: 2px dashed #0d6efd;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            grid-column: 1 / -1;
        }

        .drop-area:hover,
        .drop-area.dragover {
            background: linear-gradient(135deg, #eef5ff, #e7f0ff);
            border-color: #0b5ed7;
            transform: translateY(-4px);
            box-shadow: 0 20px 50px rgba(13, 110, 253, 0.2);
        }

        .drop-area input {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            top: 0;
            left: 0;
        }

        .upload-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0d6efd, #4d9cff);
            color: #fff;
            font-size: 40px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .drop-area:hover .upload-icon {
            animation: none;
            transform: scale(1.1);
        }

        .drop-area h2 {
            font-size: 24px;
            color: #0d6efd;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .drop-area p {
            color: #666;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .upload-formats {
            display: inline-block;
            padding: 6px 12px;
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 20px;
            color: #666;
            font-size: 12px;
            font-weight: 600;
        }

        /* Settings */
        .settings-section {
            background: linear-gradient(135deg, #f8f9fa, #eef5ff);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(13, 110, 253, 0.1);
        }

        .settings-section h3 {
            color: #0d6efd;
            font-size: 18px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .setting-group {
            margin-bottom: 20px;
        }

        .setting-group:last-child {
            margin-bottom: 0;
        }

        .setting-group label {
            display: block;
            color: #333;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .quality-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        input[type="range"] {
            flex: 1;
            height: 8px;
            border-radius: 5px;
            background: linear-gradient(90deg, #0d6efd, #4d9cff);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0d6efd, #4d9cff);
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
        }

        input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0d6efd, #4d9cff);
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
        }

        .quality-value {
            background: #0d6efd;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            min-width: 50px;
        }

        .size-limit {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .size-limit input {
            padding: 10px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            font-size: 14px;
        }

        /* Preview Grid */
        #previewArea {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .preview-card {
            background: #fff;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            border: 1px solid rgba(13, 110, 253, 0.08);
        }

        .preview-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(13, 110, 253, 0.15);
        }

        .image-preview {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f8f9fa;
        }

        .card-content {
            padding: 18px;
        }

        .card-title {
            font-weight: 600;
            color: #222;
            font-size: 14px;
            margin-bottom: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .size-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 14px;
            font-size: 13px;
        }

        .size-item {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
        }

        .size-item label {
            display: block;
            color: #666;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .size-item value {
            display: block;
            color: #0d6efd;
            font-weight: 700;
            font-size: 14px;
        }

        .savings {
            background: linear-gradient(135deg, #d4edda, #c3e6cb);
            color: #155724;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 14px;
        }

        .card-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-download {
            background: linear-gradient(135deg, #0d6efd, #4d9cff);
            color: #fff;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(13, 110, 253, 0.3);
        }

        .btn-delete {
            background: #f8d7da;
            color: #721c24;
        }

        .btn-delete:hover {
            background: #f5c6cb;
        }

        /* Status */
        #status {
            padding: 16px 20px;
            border-radius: 10px;
            margin-top: 20px;
            font-weight: 600;
            text-align: center;
            display: none;
        }

        #status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        #status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        #status.info {
            background: #d1ecf1;
            color: #0c5460;
            display: block;
        }

        .clear-all-btn {
            background: #dc3545;
            color: #fff;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .clear-all-btn:hover {
            background: #c82333;
            transform: translateY(-2px);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .empty-state i {
            font-size: 48px;
            color: #ccc;
            margin-bottom: 15px;
            display: block;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 32px;
            }

            .upload-section {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .settings-section {
                grid-column: 1;
            }

            #previewArea {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <h2>
        <i class="fas fa-compress"></i>
        Image Compressor
    </h2>
</nav>

<div class="container">
    <div class="header">
        <h1>Compress Images</h1>
        <p>Reduce image size without losing quality. Supports JPG, PNG, and WEBP formats.</p>
    </div>

    <div class="upload-section">
        <div class="drop-area" id="drop-area">
            <div class="upload-icon">
                <i class="fas fa-cloud-arrow-up"></i>
            </div>
            <h2>Drag & Drop Images Here</h2>
            <p>or click to select multiple images</p>
            <div class="upload-formats">JPG / PNG / WEBP</div>
            <input type="file" id="fileElem" multiple accept="image/*" hidden>
        </div>
    </div>

    <div class="settings-section">
        <h3><i class="fas fa-sliders-h"></i> Compression Settings</h3>
        
        <div class="setting-group">
            <label>Compression Quality</label>
            <div class="quality-controls">
                <input type="range" id="qualitySlider" min="10" max="100" value="80">
                <span class="quality-value" id="qualityValue">80%</span>
            </div>
            <p style="font-size: 12px; color: #666; margin-top: 8px;">Higher = Better quality, Larger file size</p>
        </div>

        <div class="setting-group">
            <label>Max File Size (MB)</label>
            <div class="size-limit">
                <input type="number" id="maxSize" min="0.1" max="10" value="1" step="0.1" style="width: 100px;">
                <span style="align-self: center; color: #666; font-size: 14px;">MB</span>
            </div>
        </div>
    </div>

    <div id="status"></div>
    <div id="previewArea"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>

<script>
const dropArea = document.getElementById("drop-area");
const fileInput = document.getElementById("fileElem");
const previewArea = document.getElementById("previewArea");
const status = document.getElementById("status");
const qualitySlider = document.getElementById("qualitySlider");
const qualityValue = document.getElementById("qualityValue");
const maxSizeInput = document.getElementById("maxSize");

let compressed = [];

qualitySlider.addEventListener("input", () => {
    qualityValue.textContent = qualitySlider.value + "%";
});

dropArea.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", (e) => handleFiles(e.target.files));

dropArea.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropArea.classList.add("dragover");
});

dropArea.addEventListener("dragleave", () => {
    dropArea.classList.remove("dragover");
});

dropArea.addEventListener("drop", (e) => {
    e.preventDefault();
    dropArea.classList.remove("dragover");
    handleFiles(e.dataTransfer.files);
});

async function handleFiles(files) {
    const imageFiles = Array.from(files).filter(f => f.type.startsWith("image/"));

    if (imageFiles.length === 0) {
        showStatus("❌ Please select at least one image file.", "error");
        return;
    }

    showStatus(`⏳ Compressing ${imageFiles.length} image(s)...`, "info");

    for (const file of imageFiles) {
        try {
            const quality = parseInt(qualitySlider.value) / 100;
            const maxSize = parseFloat(maxSizeInput.value);

            const options = {
                maxSizeMB: maxSize,
                maxWidthOrHeight: 1920,
                useWebWorker: true,
                quality: quality
            };

            const compressedFile = await imageCompression(file, options);
            const originalURL = URL.createObjectURL(file);
            const compressedURL = URL.createObjectURL(compressedFile);

            compressed.push({
                original: file,
                compressed: compressedFile,
                originalURL,
                compressedURL
            });

            displayPreview(file, compressedFile, originalURL, compressedURL);

        } catch (err) {
            console.error(err);
            showStatus("❌ Error compressing " + file.name, "error");
        }
    }

    if (compressed.length > 0) {
        showStatus(`🎉 Successfully compressed ${compressed.length} image(s)!`, "success");
    }
}

function displayPreview(originalFile, compressedFile, origURL, compURL) {
    const card = document.createElement("div");
    card.className = "preview-card";

    const savings = (100 - (compressedFile.size / originalFile.size * 100)).toFixed(0);
    const fileName = originalFile.name.length > 20 ? 
        originalFile.name.substring(0, 17) + "..." : originalFile.name;

    card.innerHTML = `
        <img src="${origURL}" class="image-preview" alt="Preview">
        <div class="card-content">
            <div class="card-title" title="${originalFile.name}">📄 ${fileName}</div>
            
            <div class="size-info">
                <div class="size-item">
                    <label>Original</label>
                    <value>${(originalFile.size / 1024).toFixed(1)} KB</value>
                </div>
                <div class="size-item">
                    <label>Compressed</label>
                    <value>${(compressedFile.size / 1024).toFixed(1)} KB</value>
                </div>
            </div>

            <div class="savings">💾 Saved ${savings}%</div>

            <div class="card-actions">
                <button class="btn btn-download">
                    <i class="fas fa-download"></i> Download
                </button>
                <button class="btn btn-delete">
                    <i class="fas fa-trash"></i> Remove
                </button>
            </div>
        </div>
    `;

    card.querySelector(".btn-download").onclick = () => {
        const a = document.createElement("a");
        a.href = compURL;
        a.download = "compressed-" + originalFile.name;
        a.click();
    };

    card.querySelector(".btn-delete").onclick = () => {
        card.remove();
        compressed = compressed.filter(c => c.original !== originalFile);
        if (compressed.length === 0) showEmptyState();
    };

    previewArea.appendChild(card);
}

function showEmptyState() {
    if (previewArea.children.length === 0 && compressed.length === 0) {
        previewArea.innerHTML = `
            <div class="empty-state" style="grid-column: 1/-1;">
                <i class="fas fa-image"></i>
                <p>No images selected yet</p>
            </div>
        `;
    }
}

function showStatus(message, type) {
    status.className = type;
    status.innerHTML = message;
}

showEmptyState();
</script>

</body>
</html>
