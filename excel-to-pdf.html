<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Excel to PDF Converter - BHARAT TOOLS</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Excel Reader -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- HTML to PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        .converter-box { 
            max-width: 650px; 
            margin: 80px auto; 
            padding: 40px 30px; 
            background: #fff; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            text-align: center; 
        }

        .upload-zone { 
            border: 2px dashed #0d6efd; 
            padding: 50px 20px; 
            border-radius: 12px; 
            background: #f8f9fa; 
            cursor: pointer; 
            margin: 25px 0; 
            position: relative;
            transition: 0.3s;
        }

        .upload-zone:hover {
            background: #f1f3f5;
            border-color: #0b5ed7;
        }

        .upload-zone input { 
            position: absolute; 
            top: 0;
            left: 0;
            width: 100%;
            height: 100%; 
            opacity: 0;
            cursor: pointer; 
        }

        .action-btn { 
            background: #0d6efd;
            color: #fff;
            border: none; 
            padding: 14px 30px;
            font-size: 16px;
            border-radius: 8px; 
            cursor: pointer;
            display: none;
            margin: 20px auto; 
            font-weight: 600;
            width: 100%;
            transition: 0.2s;
        }

        .action-btn:hover {
            background: #0b5ed7;
        }

        #status {
            margin-top: 15px;
            font-weight: 600;
            color: #0d6efd;
            font-size: 15px;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #6c757d;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            color: #212529;
        }

        /* Background Dynamic PDF Table Design */
        #hidden-pdf-render {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 700px;
            background: #fff;
        }

        .pro-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 11px;
            margin: 20px 0;
            background: #fff;
        }

        .pro-table th {
            background-color: #0d6efd;
            color: white;
            font-weight: bold;
            border: 1px solid #dee2e6;
            padding: 10px 8px;
            text-align: left;
        }

        .pro-table td {
            border: 1px solid #dee2e6;
            padding: 8px;
            color: #333;
            text-align: left;
        }

        .pro-table tr:nth-child(even) {
            background-color: #f8f9fa;
        }
    </style>
</head>

<body>

    <div class="converter-box">

        <div style="font-size: 55px; margin-bottom: 15px; color: #0d6efd;">
            <i class="fa-solid fa-file-excel"></i>
        </div>

        <h2>Excel to PDF Converter</h2>

        <p style="color: #6c757d;">
            Convert Excel spreadsheets (.xlsx, .xls) into clean, professional PDF documents instantly.
        </p>

        <div class="upload-zone">

            <i class="fa-solid fa-cloud-arrow-up"
                style="font-size: 45px; color: #0d6efd; margin-bottom: 15px;">
            </i>

            <p id="upload-text"
                style="font-size: 16px; font-weight: 500;">
                Drag & Drop or Click to Upload Excel File
            </p>

            <input type="file"
                id="excel-file"
                accept=".xlsx,.xls,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />

        </div>

        <div id="file-name"
            style="margin-bottom: 20px; font-weight: 600; color: #198754; font-size: 14px;">
        </div>

        <button class="action-btn" id="convert-btn">
            Convert & Download PDF
        </button>

        <div id="status"></div>

        <a href="index.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Home
        </a>

    </div>


    <!-- Background Area for HTML to PDF Rendering -->

    <div id="hidden-pdf-render">
        <table id="target-excel-table" class="pro-table"></table>
    </div>


    <script>

        let outputFileName = "converted-document.pdf";
        let selectedFile = null;

        const fileInput =
            document.getElementById("excel-file");

        const fileNameBox =
            document.getElementById("file-name");

        const convertBtn =
            document.getElementById("convert-btn");

        const statusBox =
            document.getElementById("status");

        const table =
            document.getElementById("target-excel-table");


        /* ==========================================
           EXCEL FILE SELECT
        ========================================== */

        fileInput.addEventListener("change", function(e) {

            const file = e.target.files[0];

            if (!file) {
                return;
            }

            selectedFile = file;

            outputFileName =
                file.name.replace(/\.[^/.]+$/, "") + ".pdf";


            fileNameBox.innerHTML =
                '<i class="fa-solid fa-check-circle"></i> Selected: ' +
                file.name;

            fileNameBox.style.color = "#198754";

            convertBtn.style.display = "block";


            statusBox.innerText =
                "Reading Excel file...";

            statusBox.style.color =
                "#0d6efd";


            /* Check XLSX library */

            if (typeof XLSX === "undefined") {

                statusBox.innerText =
                    "❌ Excel library failed to load. Please refresh the page.";

                statusBox.style.color =
                    "#dc3545";

                console.error(
                    "XLSX library is not loaded."
                );

                return;
            }


            /* ==========================================
               READ EXCEL FILE
            ========================================== */

            const reader =
                new FileReader();


            reader.onload = function(event) {

                try {

                    const data =
                        new Uint8Array(
                            event.target.result
                        );


                    console.log(
                        "Excel file size:",
                        data.length
                    );


                    /* Read XLS and XLSX */

                    const workbook =
                        XLSX.read(data, {
                            type: "array",
                            cellDates: true
                        });


                    console.log(
                        "Excel sheets:",
                        workbook.SheetNames
                    );


                    if (
                        !workbook.SheetNames ||
                        workbook.SheetNames.length === 0
                    ) {

                        throw new Error(
                            "No worksheet found."
                        );
                    }


                    const firstSheetName =
                        workbook.SheetNames[0];


                    const worksheet =
                        workbook.Sheets[
                            firstSheetName
                        ];


                    if (!worksheet) {

                        throw new Error(
                            "Worksheet could not be opened."
                        );
                    }


                    /* Convert Excel to array */

                    const json =
                        XLSX.utils.sheet_to_json(
                            worksheet,
                            {
                                header: 1,
                                defval: "",
                                raw: false
                            }
                        );


                    if (
                        !json ||
                        json.length === 0
                    ) {

                        throw new Error(
                            "Excel sheet is empty."
                        );
                    }


                    /* Clear previous table */

                    table.innerHTML = "";


                    /* Find maximum number of columns */

                    let maxColumns = 0;

                    json.forEach(function(row) {

                        if (
                            Array.isArray(row) &&
                            row.length > maxColumns
                        ) {
                            maxColumns =
                                row.length;
                        }

                    });


                    if (maxColumns === 0) {

                        throw new Error(
                            "No data found in Excel sheet."
                        );
                    }


                    /* ==========================================
                       CREATE PDF TABLE
                    ========================================== */

                    json.forEach(function(row, rowIndex) {

                        const tr =
                            document.createElement("tr");


                        for (
                            let column = 0;
                            column < maxColumns;
                            column++
                        ) {

                            let cellValue = "";


                            if (
                                Array.isArray(row) &&
                                row[column] !== undefined &&
                                row[column] !== null
                            ) {

                                cellValue =
                                    String(
                                        row[column]
                                    );

                            }


                            const cellElement =
                                rowIndex === 0
                                    ? document.createElement("th")
                                    : document.createElement("td");


                            cellElement.textContent =
                                cellValue;


                            tr.appendChild(
                                cellElement
                            );

                        }


                        table.appendChild(tr);

                    });


                    statusBox.innerText =
                        "✅ Excel file ready. Click Convert & Download PDF.";

                    statusBox.style.color =
                        "#198754";


                    console.log(
                        "Excel successfully loaded."
                    );

                }
                catch (error) {

                    console.error(
                        "EXCEL READ ERROR:",
                        error
                    );


                    statusBox.innerText =
                        "❌ Could not read Excel file.";

                    statusBox.style.color =
                        "#dc3545";

                }

            };


            reader.onerror = function() {

                statusBox.innerText =
                    "❌ Browser could not read this file.";

                statusBox.style.color =
                    "#dc3545";

            };


            reader.readAsArrayBuffer(file);

        });


        /* ==========================================
           CONVERT EXCEL TO PDF
        ========================================== */

        convertBtn.addEventListener(
            "click",
            function() {

                if (!selectedFile) {

                    statusBox.innerText =
                        "❌ Please select an Excel file first.";

                    statusBox.style.color =
                        "#dc3545";

                    return;
                }


                if (!table.rows.length) {

                    statusBox.innerText =
                        "❌ Excel data is not available.";

                    statusBox.style.color =
                        "#dc3545";

                    return;
                }


                if (
                    typeof html2pdf === "undefined"
                ) {

                    statusBox.innerText =
                        "❌ PDF library failed to load.";

                    statusBox.style.color =
                        "#dc3545";

                    return;
                }


                statusBox.innerText =
                    "Converting... Please wait.";

                statusBox.style.color =
                    "#0d6efd";


                /* ==========================================
                   PDF SETTINGS
                ========================================== */

                const conversionOptions = {

                    margin: 20,

                    filename:
                        outputFileName,

                    image: {
                        type: "jpeg",
                        quality: 1
                    },

                    html2canvas: {

                        scale: 2,

                        useCORS: true,

                        logging: false,

                        backgroundColor:
                            "#ffffff"

                    },

                    jsPDF: {

                        unit: "pt",

                        format: "a4",

                        orientation:
                            "landscape"

                    },

                    pagebreak: {

                        mode: [
                            "css",
                            "legacy"
                        ]

                    }

                };


                /* ==========================================
                   GENERATE PDF
                ========================================== */

                html2pdf()

                    .set(
                        conversionOptions
                    )

                    .from(table)

                    .save()

                    .then(function() {

                        statusBox.innerText =
                            "🎉 PDF Downloaded Successfully!";

                        statusBox.style.color =
                            "#28a745";

                    })

                    .catch(function(error) {

                        console.error(
                            "PDF CONVERSION ERROR:",
                            error
                        );

                        statusBox.innerText =
                            "❌ PDF conversion failed.";

                        statusBox.style.color =
                            "#dc3545";

                    });

            }
        );

    </script>

</body>
</html>
