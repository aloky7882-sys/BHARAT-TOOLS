<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel to PDF Converter - BHARAT TOOLS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <!-- Stable Required Libraries -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>

    <style>
        .converter-box { 
            max-width: 700px; 
            margin: 50px auto; 
            padding: 30px; 
            background: #fff; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            text-align: center; 
        }
        .upload-zone { 
            border: 2px dashed #0d6efd; 
            padding: 40px 20px; 
            border-radius: 8px; 
            background: #f8f9fa; 
            cursor: pointer; 
            margin: 20px 0; 
            position: relative; 
        }
        .upload-zone input { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            opacity: 0; cursor: pointer; 
        }
        .action-btn { 
            background: #0d6efd; color: #fff; border: none; 
            padding: 12px 30px; font-size: 16px; border-radius: 6px; 
            cursor: pointer; display: none; margin: 15px auto; 
            font-weight: 500; width: 100%; 
        }
        #status { margin-top: 15px; font-weight: 500; color: #28a745; }
        .back-link { display: inline-block; margin-top: 20px; color: #6c757d; text-decoration: none; }
        
        /* Preview Table Styles */
        #preview-area {
            display: none;
            margin-top: 25px;
            overflow-x: auto;
            text-align: left;
            background: #ffffff;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        .excel-table {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
            font-size: 12px;
        }
        .excel-table th {
            background-color: #f2f2f2;
            color: #333;
            font-weight: bold;
            border: 1px solid #ddd;
            padding: 8px;
        }
        .excel-table td {
            border: 1px solid #ddd;
            padding: 8px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="converter-box">
        <div style="font-size: 50px; margin-bottom: 15px;">📊</div>
        <h2>Excel to PDF Converter</h2>
        <p>Convert your Excel spreadsheets (.xlsx, .xls) into clean PDF documents instantly.</p>
        
        <div class="upload-zone">
            <i class="fa-solid fa-file-excel" style="font-size: 40px; color: #0d6efd; margin-bottom: 10px;"></i>
            <p id="upload-text">Drag & Drop or Click to Upload Excel File</p>
            <input type="file" id="excel-file" accept=".xlsx, .xls" />
        </div>
        
        <div id="file-name" style="margin-bottom: 15px; font-weight: bold; color: #555;"></div>
        
        <button class="action-btn" id="convert-btn">Convert & Download PDF</button>
        <div id="status"></div>

        <!-- Dynamic Hidden Table Area For PDF Generation -->
        <div id="preview-area">
            <table id="data-table" class="excel-table"></table>
        </div>

        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    </div>

    <script>
        let fName = "excel-converted.pdf";

        document.getElementById('excel-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                fName = file.name.replace(/\.[^/.]+$/, "") + ".pdf";
                document.getElementById('file-name').innerText = "Selected: " + file.name;
                document.getElementById('convert-btn').style.display = 'block';
                document.getElementById('status').innerText = "";
                document.getElementById('preview-area').style.display = 'none';
                
                // Read Excel data to construct stable HTML preview
                const reader = new FileReader();
                reader.onload = function(event) {
                    const data = new Uint8Array(event.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const sheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                    
                    const table = document.getElementById('data-table');
                    table.innerHTML = "";
                    
                    json.forEach((row, rowIndex) => {
                        const tr = document.createElement('tr');
                        row.forEach(cell => {
                            const element = rowIndex === 0 ? document.createElement('th') : document.createElement('td');
                            element.innerText = cell !== undefined && cell !== null ? cell : "";
                            tr.appendChild(element);
                        });
                        table.appendChild(tr);
                    });
                };
                reader.readAsArrayBuffer(file);
            }
        });

        document.getElementById('convert-btn').addEventListener('click', function() {
            const tableElement = document.getElementById('data-table');
            if (tableElement.rows.length === 0) {
                document.getElementById('status').innerText = "❌ No data found to convert.";
                document.getElementById('status').style.color = "#dc3545";
                return;
            }

            document.getElementById('status').innerText = "Generating PDF... Please wait.";
            document.getElementById('status').style.color = "#0d6efd";
            document.getElementById('preview-area').style.display = 'block';

            // HTML to Direct PDF Conversion Options
            const opt = {
                margin: 30,
                filename: fName,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'pt', format: 'a4', orientation: 'portrait' }
            };

            // Stable Trigger Action
            html2pdf().set(opt).from(tableElement).save().then(() => {
                document.getElementById('status').innerText = "🎉 PDF Downloaded Successfully!";
                document.getElementById('status').style.color = "#28a745";
                document.getElementById('preview-area').style.display = 'none';
            }).catch(err => {
                document.getElementById('status').innerText = "❌ Download failed. Please try again.";
                document.getElementById('status').style.color = "#dc3545";
                console.error(err);
            });
        });
    </script>
</body>
</html>
