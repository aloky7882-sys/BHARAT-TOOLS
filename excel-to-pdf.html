<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Excel to PDF - BHARAT TOOLS</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:#f5f7fb;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:20px;

}

.container{

width:100%;

max-width:700px;

background:#fff;

padding:35px;

border-radius:20px;

box-shadow:0 15px 40px rgba(0,0,0,.12);

text-align:center;

}

h1{

color:#0d6efd;

margin-bottom:10px;

}

p{

color:#666;

margin-bottom:30px;

}

.upload{

border:3px dashed #0d6efd;

padding:45px 20px;

border-radius:18px;

cursor:pointer;

transition:.3s;

}

.upload:hover{

background:#eef5ff;

}

.upload i{

font-size:70px;

display:block;

margin-bottom:15px;

}

input{

display:none;

}

button{

margin-top:25px;

padding:15px 35px;

border:none;

background:#0d6efd;

color:#fff;

font-size:17px;

border-radius:50px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#0954c9;

}

#status{

margin-top:25px;

font-weight:600;

color:#0d6efd;

}

</style>

</head>

<body>

<div class="container">

<h1>📊 Excel to PDF</h1>

<p>Upload Excel File (.xlsx / .xls)</p>

<label class="upload">

📁 Click to Select Excel File

<input

type="file"

id="excelFile"

accept=".xlsx,.xls">

</label>

<button onclick="convertPDF()">

Convert to PDF

</button>

<div id="status"></div>

</div>
<script>

let workbook;

document.getElementById("excelFile").addEventListener("change", function(e){

const file=e.target.files[0];

if(!file) return;

document.getElementById("status").innerHTML="📖 Reading Excel File...";

const reader=new FileReader();

reader.onload=function(evt){

const data=new Uint8Array(evt.target.result);

workbook=XLSX.read(data,{type:"array"});

document.getElementById("status").innerHTML="✅ Excel Loaded Successfully";

};

reader.readAsArrayBuffer(file);

});


function convertPDF(){

if(!workbook){

alert("Please select an Excel file.");

return;

}

document.getElementById("status").innerHTML="⏳ Converting...";

const sheetName=workbook.SheetNames[0];

const worksheet=workbook.Sheets[sheetName];

const json=XLSX.utils.sheet_to_json(worksheet,{header:1});

const {jsPDF}=window.jspdf;

const doc=new jsPDF("p","pt","a4");

doc.setFontSize(18);

doc.text("BHARAT TOOLS",40,35);

doc.setFontSize(12);

doc.text("Excel to PDF",40,55);

doc.autoTable({

head:[json[0]],

body:json.slice(1),

startY:80,

theme:"grid",

styles:{

fontSize:8,

cellPadding:4

},

headStyles:{

fillColor:[13,110,253]

}

});

doc.save("bharat-tools.pdf");

document.getElementById("status").innerHTML="✅ PDF Downloaded";

}

</script>

</body>

</html>
