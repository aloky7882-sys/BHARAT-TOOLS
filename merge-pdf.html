<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Merge PDF - Bharat Tools</title>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6fb;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
background:#fff;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
max-width:700px;
width:100%;
text-align:center;
}

h1{
margin-bottom:20px;
}

input{
width:100%;
margin:20px 0;
}

button{
padding:15px 25px;
background:#0d6efd;
color:#fff;
border:none;
border-radius:8px;
cursor:pointer;
font-size:18px;
margin-top:20px;
}

button:hover{
background:#084298;
}

#status{
margin-top:20px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>📑 Merge PDF</h1>

<input type="file" id="upload" multiple accept=".pdf">

<button id="merge">
Merge & Download
</button>

<p id="status"></p>

</div>

<script>

const upload=document.getElementById("upload");
const status=document.getElementById("status");

document.getElementById("merge").onclick=async()=>{

if(upload.files.length<2){

alert("Please Select Minimum 2 PDF Files");

return;

}

status.innerHTML="Merging PDF...";

const mergedPdf=await PDFLib.PDFDocument.create();

for(const file of upload.files){

const bytes=await file.arrayBuffer();

const pdf=await PDFLib.PDFDocument.load(bytes);

const pages=await mergedPdf.copyPages(pdf,pdf.getPageIndices());

pages.forEach(page=>mergedPdf.addPage(page));

}

const pdfBytes=await mergedPdf.save();

const blob=new Blob([pdfBytes],{type:"application/pdf"});

const link=document.createElement("a");

link.href=URL.createObjectURL(blob);

link.download="Merged-PDF.pdf";

link.click();

status.innerHTML="✅ PDF Merged Successfully";

}

</script>

</body>
</html>
